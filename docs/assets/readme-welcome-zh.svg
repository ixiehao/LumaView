<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">LumaView 欢迎界面预览</title>
  <desc id="description">深色模式下的 LumaView 原创产品界面预览，显示打开文件入口和原生工具栏。</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202124"/><stop offset="1" stop-color="#101114"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21cfdf"/><stop offset=".48" stop-color="#4b72ff"/><stop offset=".74" stop-color="#d239e6"/><stop offset="1" stop-color="#ff5a77"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity=".36"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#0e1015"/>
  <rect x="75" y="68" width="1450" height="864" rx="32" fill="url(#canvas)" filter="url(#shadow)"/>
  <path d="M107 68h1386a32 32 0 0 1 32 32v94H75v-94a32 32 0 0 1 32-32z" fill="#302d2c"/>
  <circle cx="125" cy="131" r="13" fill="#ff5f58"/><circle cx="165" cy="131" r="13" fill="#ffbd2f"/><circle cx="205" cy="131" r="13" fill="#28c940"/>
  <g transform="translate(260 102)"><rect width="39" height="39" rx="11" fill="url(#brand)"/><rect x="8" y="8" width="23" height="23" rx="5" fill="none" stroke="#fff" stroke-width="3"/><path d="m11 28 7-8 5 5 4-4 4 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="14" r="3" fill="#ffc22f"/><text x="54" y="28" fill="#f5f4f5" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="27" font-weight="700">LumaView</text></g>
  <g fill="none" stroke="#f2f0f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".94">
    <path d="m842 121-12 10 12 10m30-20 12 10-12 10"/>
    <circle cx="958" cy="130" r="13"/><path d="m968 140 10 10"/>
    <path d="M1042 118h11m-11 24h11m-11-24v24m23-24v24m-23-12h23"/>
    <circle cx="1137" cy="130" r="13"/><path d="M1137 110v40m-20-20h40"/>
    <path d="M1225 112a20 20 0 1 1-12 36m-2-31-1 10 10-1"/>
    <path d="M1320 148a20 20 0 1 0-12-36m-2 11 10-1-1-10"/>
    <rect x="1380" y="113" width="31" height="29" rx="4"/><path d="M1387 113v-8h17v8m-17 29h17m-17-16h17"/>
  </g>
  <path d="M75 194h1450" stroke="#ffffff" stroke-opacity=".09"/>
  <g transform="translate(720 330)">
    <rect width="160" height="160" rx="40" fill="url(#brand)"/>
    <rect x="25" y="25" width="110" height="110" rx="25" fill="#1b1b1d"/>
    <circle cx="111" cy="53" r="12" fill="#ffc037"/>
    <path d="m41 113 32-36 23 25 17-18 21 29z" fill="#39aaf8"/>
    <path d="m79 113 27-26 28 26z" fill="#f241b6"/>
  </g>
  <text x="800" y="562" text-anchor="middle" fill="#f7f6f7" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="52" font-weight="700">LumaView</text>
  <text x="800" y="612" text-anchor="middle" fill="#aaa9ae" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="20">打开文件，或把它拖到这里。</text>
  <g transform="translate(704 650)"><rect width="192" height="48" rx="24" fill="#087aff"/><path d="M31 18h13l5 5v11H31z" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><text x="61" y="31" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="18" font-weight="700">打开文件</text></g>
  <text x="112" y="873" fill="#7d7b82" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16">本地浏览 · 无账户 · 无上传</text>
</svg>
