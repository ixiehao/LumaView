name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # UI tests execute on Apple Silicon; validate-project.sh also compiles and
    # verifies the x86_64 slice in the universal Release app.
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Validate project
        env:
          LUMAVIEW_TEST_RESULT_PATH: ${{ runner.temp }}/LumaViewTests.xcresult
        run: ./Scripts/validate-project.sh
      - name: Keep failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: LumaView-test-results
          path: ${{ runner.temp }}/LumaViewTests.xcresult
          retention-days: 7
          if-no-files-found: warn
