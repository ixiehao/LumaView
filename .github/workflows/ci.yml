name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      strict_warnings:
        description: Treat complete Swift concurrency and compiler warnings as errors
        type: boolean
        default: false
      test_scope:
        description: Diagnostic test selection (releases require all)
        type: choice
        options: [all, core, fullscreen]
        default: all

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.arch }}${{ inputs.test_scope && inputs.test_scope != 'all' && format(' ({0} diagnostic)', inputs.test_scope) || '' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    # Each architecture runs its full core/UI suite on native hardware, then
    # builds and verifies its own size-optimized Release app.
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Validate project
        env:
          LUMAVIEW_TEST_RESULT_PATH: ${{ runner.temp }}/LumaViewTests.xcresult
          LUMAVIEW_ARCH: ${{ matrix.arch }}
          LUMAVIEW_STRICT_WARNINGS: ${{ inputs.strict_warnings && '1' || '0' }}
          LUMAVIEW_TEST_SCOPE: ${{ inputs.test_scope || 'all' }}
        run: ./Scripts/validate-project.sh
      - name: Keep failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: LumaView-test-results-${{ matrix.arch }}
          path: ${{ runner.temp }}/LumaViewTests.xcresult
          retention-days: 7
          if-no-files-found: warn
