name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # UI tests execute on Apple Silicon; validate-project.sh also compiles and
    # verifies the x86_64 slice in the universal Release app.
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Validate project
        run: ./Scripts/validate-project.sh
